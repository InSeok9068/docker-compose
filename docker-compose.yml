##############################
# Common Configuration
##############################

x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-pocket-app: &pocket-app
  restart: unless-stopped
  stop_grace_period: 30s
  expose:
    - "8090"
  networks:
    - private
    - egress
  logging: *common-logging

services:
  ##############################
  # Core Infrastructure
  ##############################

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    environment:
      RSS_BRIDGE_PASSWORD_HASH: ${RSS_BRIDGE_PASSWORD_HASH:?set RSS_BRIDGE_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app/caddy:/data
      - ./config/caddy:/etc/caddy:ro
    networks:
      - public
      - private
    logging: *common-logging

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: https://monitor.development-support.o-r.kr
    expose:
      - "8090"
    volumes:
      - ./app/beszel/data:/beszel_data
      - ./app/beszel/socket:/beszel_socket
    networks:
      - private
      - egress
    logging: *common-logging

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./app/beszel/agent-data:/var/lib/beszel-agent
      - ./app/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: https://monitor.development-support.o-r.kr
      TOKEN: "${BESZEL_TOKEN:?set BESZEL_TOKEN}"
      KEY: "${BESZEL_KEY:?set BESZEL_KEY}"
    logging: *common-logging

  ##############################
  # PocketBase / PocketPages Apps
  ##############################

  todo-pocketbase:
    <<: *pocket-app
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: todo-pocketbase
    environment:
      PB_HOST: 0.0.0.0
      PB_PORT: 8090
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/todo/data:/pb_data
      - /path/to/todo/public:/pb_public
      - /path/to/todo/hooks:/pb_hooks
      # - /path/to/todo/migrations:/pb_migrations:ro

  stylemate-pocketbase:
    <<: *pocket-app
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: stylemate-pocketbase
    environment:
      PB_HOST: 0.0.0.0
      PB_PORT: 8090
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/stylemate/data:/pb_data
      - /path/to/stylemate/public:/pb_public
      - /path/to/stylemate/hooks:/pb_hooks
      # - /path/to/stylemate/migrations:/pb_migrations:ro

  kjca-pocketpages:
    <<: *pocket-app
    image: ghcr.io/inseok9068/kjca:release
    container_name: kjca-pocketpages
    environment:
      APP_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/kjca/data:/app/apps/kjca/pb_data
      - /path/to/kjca/public:/app/apps/kjca/pb_public
      - /path/to/kjca/hooks:/app/apps/kjca/pb_hooks
      # - /path/to/kjca/migrations:/app/apps/kjca/pb_migrations:ro

  sample-pocketpages:
    <<: *pocket-app
    image: ghcr.io/inseok9068/sample:release
    container_name: sample-pocketpages
    environment:
      APP_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/sample/data:/app/apps/sample/pb_data
      - /path/to/sample/public:/app/apps/sample/pb_public
      - /path/to/sample/hooks:/app/apps/sample/pb_hooks
      # - /path/to/sample/migrations:/app/apps/sample/pb_migrations:ro

  booklog-pocketpages:
    <<: *pocket-app
    image: ghcr.io/inseok9068/booklog:release
    container_name: booklog-pocketpages
    environment:
      APP_ENV: production
      # GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      DATA4LIBRARY_APIKEY: ${DATA4LIBRARY_APIKEY:?set DATA4LIBRARY_APIKEY}
      ONESIGNAL_APPID: ${ONESIGNAL_APPID:?set ONESIGNAL_APPID}
      ONESIGNAL_APIKEY: ${ONESIGNAL_APIKEY:?set ONESIGNAL_APIKEY}
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/booklog/data:/app/apps/booklog/pb_data
      - /path/to/booklog/public:/app/apps/booklog/pb_public
      - /path/to/booklog/hooks:/app/apps/booklog/pb_hooks
      # - /path/to/booklog/migrations:/app/apps/booklog/pb_migrations:ro

  photofolio-pocketpages:
    <<: *pocket-app
    image: ghcr.io/inseok9068/photofolio:release
    container_name: photofolio-pocketpages
    environment:
      APP_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      FRED_APIKEY: ${FRED_APIKEY:?set FRED_APIKEY}
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/photofolio/data:/app/apps/photofolio/pb_data
      - /path/to/photofolio/public:/app/apps/photofolio/pb_public
      - /path/to/photofolio/hooks:/app/apps/photofolio/pb_hooks
      # - /path/to/photofolio/migrations:/app/apps/photofolio/pb_migrations:ro

  homeping-pocketpages:
    <<: *pocket-app
    image: ghcr.io/inseok9068/homeping:release
    container_name: homeping-pocketpages
    environment:
      APP_ENV: production
      DATAGOKR_APIKEY: ${DATAGOKR_APIKEY:?set DATAGOKR_APIKEY}
      HOMEPING_ONESIGNAL_APIKEY: ${HOMEPING_ONESIGNAL_APIKEY:?set HOMEPING_ONESIGNAL_APIKEY}
      HOMEPING_ONESIGNAL_APPID: ${HOMEPING_ONESIGNAL_APPID:?set HOMEPING_ONESIGNAL_APPID}
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/homeping/data:/app/apps/homeping/pb_data
      - /path/to/homeping/public:/app/apps/homeping/pb_public
      - /path/to/homeping/hooks:/app/apps/homeping/pb_hooks
      # - /path/to/homeping/migrations:/app/apps/homeping/pb_migrations:ro

  launchboard-pocketpages:
    <<: *pocket-app
    image: ghcr.io/inseok9068/launchboard:release
    container_name: launchboard-pocketpages
    environment:
      APP_ENV: production
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/launchboard/data:/app/apps/launchboard/pb_data
      - /path/to/launchboard/public:/app/apps/launchboard/pb_public
      - /path/to/launchboard/hooks:/app/apps/launchboard/pb_hooks
      # - /path/to/launchboard/migrations:/app/apps/launchboard/pb_migrations:ro

  seedlab-pocketpages:
    <<: *pocket-app
    image: ghcr.io/inseok9068/seedlab:release
    container_name: seedlab-pocketpages
    environment:
      APP_ENV: production
      SEEDLAB_CREDENTIAL_KEY: ${SEEDLAB_CREDENTIAL_KEY:?set SEEDLAB_CREDENTIAL_KEY}
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/seedlab/data:/app/apps/seedlab/pb_data
      - /path/to/seedlab/public:/app/apps/seedlab/pb_public
      - /path/to/seedlab/hooks:/app/apps/seedlab/pb_hooks
      # - /path/to/seedlab/migrations:/app/apps/seedlab/pb_migrations:ro

  dulkong-pocketpages:
    <<: *pocket-app
    image: ghcr.io/inseok9068/dulkong:release
    container_name: dulkong-pocketpages
    environment:
      APP_ENV: production
      DULKONG_ONESIGNAL_APPID: ${DULKONG_ONESIGNAL_APPID:?set DULKONG_ONESIGNAL_APPID}
      DULKONG_ONESIGNAL_APIKEY: ${DULKONG_ONESIGNAL_APIKEY:?set DULKONG_ONESIGNAL_APIKEY}
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/dulkong/data:/app/apps/dulkong/pb_data
      - /path/to/dulkong/public:/app/apps/dulkong/pb_public
      - /path/to/dulkong/hooks:/app/apps/dulkong/pb_hooks
      # - /path/to/dulkong/migrations:/app/apps/dulkong/pb_migrations:ro

  gyeolbit-pocketpages:
    <<: *pocket-app
    image: ghcr.io/inseok9068/gyeolbit:release
    container_name: gyeolbit-pocketpages
    environment:
      APP_ENV: production
      # 초기 1회만 사용 후 제거 권장
      # PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      # PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
    volumes:
      - /path/to/gyeolbit/data:/app/apps/gyeolbit/pb_data
      - /path/to/gyeolbit/public:/app/apps/gyeolbit/pb_public
      - /path/to/gyeolbit/hooks:/app/apps/gyeolbit/pb_hooks
      # - /path/to/gyeolbit/migrations:/app/apps/gyeolbit/pb_migrations:ro

  ##############################
  # Utility Services
  ##############################

  squash-helper:
    container_name: squash-helper
    image: ghcr.io/inseok9068/squash-helper:release
    restart: unless-stopped
    init: true
    expose:
      - "8080"
    networks:
      - private
      - egress
    logging: *common-logging

  ##############################
  # Personal Services
  ##############################

  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    expose:
      - "80"
    environment:
      TZ: Asia/Seoul

      # RSS 자동 갱신
      # 매시 7분, 37분 → 약 30분 간격
      CRON_MIN: "7,37"

      # FreshRSS에서 내부 RSS-Bridge에 접근 허용
      INTERNAL_HOST_ALLOWLIST: "rss-bridge:80"

    volumes:
      - ./app/freshrss/data:/var/www/FreshRSS/data
      - ./app/freshrss/extensions:/var/www/FreshRSS/extensions
    networks:
      - private
      - egress
    logging: *common-logging

  rss-bridge:
    image: rssbridge/rss-bridge:latest
    container_name: rss-bridge
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./app/rss-bridge/config:/config
    networks:
      - private
      - egress
    logging: *common-logging

##############################
# Networks
##############################

networks:
  public:

  private:
    internal: true

  # Outbound(egress) is allowed on this network.
  # Attach services that must call external APIs.
  egress:
